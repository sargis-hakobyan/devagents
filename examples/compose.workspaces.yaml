name: devagents-private-preview
x-image: &image
  image: devagents-private-preview:local
  build:
    context: ..
  init: true
  read_only: true
  cap_drop: [ALL]
x-runtime: &runtime
  <<: *image
  cpus: 2
  mem_limit: 4g
  pids_limit: 512
  tmpfs:
    - /tmp:size=128m,mode=1777
    - /run/devagents-auth:size=64m,mode=0700,uid=1000,gid=1000,exec
  security_opt: ["no-new-privileges:true", "systempaths=unconfined"]
  environment: &worker-environment
    DEVAGENTS_MODE: shared
    DEVAGENTS_PUBLIC_ORIGIN: http://127.0.0.1:${DEVAGENTS_PREVIEW_PORT:-4312}
    DEVAGENTS_CREDENTIAL_RUNTIME: /run/devagents-auth
  healthcheck:
    test: ["CMD", "node", "-e", "require('http').get({socketPath:'/run/devagents-workspace/api.sock',path:'/health'}, r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
    interval: 5s
    timeout: 4s
    retries: 10
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devagents
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin
    secrets: [postgres-admin, workspace-db, gateway-db]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infra/postgres:/opt/devagents-db:ro
      - ../infra/postgres/init-public.sql:/docker-entrypoint-initdb.d/01-public.sql:ro
      - ../infra/postgres/shared-roles.sql:/docker-entrypoint-initdb.d/10-services.sql:ro
    networks: [alice-network, bob-network, gateway-network]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-d", "devagents", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  # This one-shot development fixture seeds only the example's dedicated login volume.
  demo-accounts:
    <<: *image
    depends_on: {postgres: {condition: service_healthy}}
    networks: [gateway-network]
    secrets: [gateway-db]
    environment: &gateway-db
      DEVAGENTS_POSTGRES_HOST: postgres
      DEVAGENTS_POSTGRES_USER: devagents_gateway
      DEVAGENTS_POSTGRES_PASSWORD_FILE: /run/secrets/gateway-db
    command: ["node", "/demo/seed.mjs"]
    volumes:
      - gateway-data:/data
      - ./workspace-demo-accounts.mjs:/demo/seed.mjs:ro
  alice:
    <<: *runtime
    depends_on: {postgres: {condition: service_healthy}}
    secrets: [workspace-db]
    environment:
      <<: *worker-environment
      DEVAGENTS_POSTGRES_HOST: postgres
      DEVAGENTS_POSTGRES_USER: devagents_worker_service
      DEVAGENTS_WORKSPACE_ID: "11111111-1111-4111-8111-111111111111"
      DEVAGENTS_POSTGRES_PASSWORD_FILE: /run/secrets/workspace-db
    command: ["sh", "/demo/start.sh", "11111111-1111-4111-8111-111111111111"]
    volumes:
      - ./start-demo-workspace.sh:/demo/start.sh:ro
      - alice-data:/data
      - alice-socket:/run/devagents-workspace
      - alice-repos:/projects
    networks: [alice-network]
  bob:
    <<: *runtime
    depends_on: {postgres: {condition: service_healthy}}
    secrets: [workspace-db]
    environment:
      <<: *worker-environment
      DEVAGENTS_POSTGRES_HOST: postgres
      DEVAGENTS_POSTGRES_USER: devagents_worker_service
      DEVAGENTS_WORKSPACE_ID: "22222222-2222-4222-8222-222222222222"
      DEVAGENTS_POSTGRES_PASSWORD_FILE: /run/secrets/workspace-db
    command: ["sh", "/demo/start.sh", "22222222-2222-4222-8222-222222222222"]
    volumes:
      - ./start-demo-workspace.sh:/demo/start.sh:ro
      - bob-data:/data
      - bob-socket:/run/devagents-workspace
      - bob-repos:/projects
    networks: [bob-network]
  gateway:
    <<: *image
    networks: [gateway-network]
    secrets: [gateway-db]
    command: ["node", "dist/cli/main.js", "gateway", "/run/workspaces"]
    depends_on:
      demo-accounts: {condition: service_completed_successfully}
      alice: {condition: service_healthy}
      bob: {condition: service_healthy}
    environment:
      <<: *gateway-db
      DEVAGENTS_MODE: shared
      DEVAGENTS_PUBLIC_ORIGIN: http://127.0.0.1:${DEVAGENTS_PREVIEW_PORT:-4312}
    ports: ["127.0.0.1:${DEVAGENTS_PREVIEW_PORT:-4312}:4310"]
    volumes:
      - gateway-data:/data
      - alice-socket:/run/workspaces/11111111-1111-4111-8111-111111111111:ro
      - bob-socket:/run/workspaces/22222222-2222-4222-8222-222222222222:ro
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres-data:
  gateway-data:
  alice-data:
  bob-data:
  alice-repos:
  bob-repos:
  alice-socket:
  bob-socket:
networks:
  gateway-network:
  alice-network:
  bob-network:
secrets:
  postgres-admin: {file: "${DEVAGENTS_DB_SECRETS_DIR:?set an absolute directory}/postgres-admin"}
  workspace-db: {file: "${DEVAGENTS_DB_SECRETS_DIR:?set an absolute directory}/workspace-db"}
  gateway-db: {file: "${DEVAGENTS_DB_SECRETS_DIR:?set an absolute directory}/gateway-db"}
