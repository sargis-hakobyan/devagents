schemaVersion: 1
qaEnabled: false # separate agent QA is opt-in; developer validation and independent review remain required
devagentsRules: false # true adds role scopes, command allowlist and read-only validation
defaultEngine: codex
defaultProvider: openai
# M2 runs serially; higher concurrency is reserved for M3.
concurrency: 1
maxRepairCycles: 3
executionTimeoutMs: 1800000
validationTimeoutMs: 600000
# Archive unfinished files, then release completed/failed/cancelled task worktrees and caches.
cleanupTerminalTasks: true
# Legacy successful-task policy when cleanupTerminalTasks is disabled. Disable both to retain environments.
compactCompletedTasks: true
minFreeDiskBytes: 5368709120 # per parallel new checkout (5 GiB)
# Optional strict-mode entry limit. Rules-off scans still check links/secrets without this count gate.
workspaceScanLimit: 200000
providers:
  - id: openai
    kind: openai
    auth: login
  - id: anthropic
    kind: anthropic
    auth: login # dedicated saved API key or personal subscription token
    # For an explicit environment-only API key, use auth: api-key and apiKeyEnv: ANTHROPIC_API_KEY
  # Configuration seam only: local execution is a follow-up milestone.
  - id: local
    kind: ollama
    auth: none
    baseUrl: http://127.0.0.1:11434

# Optional cost estimates: USD per million tokens, for an exact pinned model ID.
# Illustrative values only; replace with your provider's published rates and date.
# usagePricing:
#   models:
#     your-pinned-model:
#       inputPerMillion: 2
#       cachedInputPerMillion: 0.5
#       outputPerMillion: 8
#       asOf: '2026-11-03'
#   eur:
#     usdToEur: 0.9 # illustrative conversion, not a live exchange rate
#     asOf: '2026-11-03'
