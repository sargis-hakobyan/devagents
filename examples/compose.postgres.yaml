# Combine with compose.workspaces.yaml. The database is reachable only on the private runtime networks.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devagents
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin
    secrets: [postgres-admin, alice-db, bob-db]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infra/postgres/30-history.sql:/docker-entrypoint-initdb.d/30-history.sql:ro
      - ../infra/postgres/tasks.sql:/docker-entrypoint-initdb.d/10-tasks.sql:ro
      - ../infra/postgres/20-example-roles.sql:/docker-entrypoint-initdb.d/20-example-roles.sql:ro
    networks: [alice-network, bob-network]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-d", "devagents", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  alice:
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      DEVAGENTS_POSTGRES_HOST: postgres
      DEVAGENTS_POSTGRES_PASSWORD_FILE: /run/secrets/alice-db
    secrets: [alice-db]
  bob:
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      DEVAGENTS_POSTGRES_HOST: postgres
      DEVAGENTS_POSTGRES_PASSWORD_FILE: /run/secrets/bob-db
    secrets: [bob-db]
volumes:
  postgres-data:
secrets:
  postgres-admin: {file: "${DEVAGENTS_DB_SECRETS_DIR:?set an absolute directory}/postgres-admin"}
  alice-db: {file: "${DEVAGENTS_DB_SECRETS_DIR:?set an absolute directory}/alice-db"}
  bob-db: {file: "${DEVAGENTS_DB_SECRETS_DIR:?set an absolute directory}/bob-db"}
